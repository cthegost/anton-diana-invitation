<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Антон и Диана — приглашение на хупу</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#f7f3ec;font-family:Arial,Helvetica,sans-serif}#gate{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,rgba(6,7,7,.74),rgba(8,11,10,.86)),url('https://anton-diana-chuppah.n-aorn2456.chatgpt.site/anton-diana-real.jpg') center/cover no-repeat}.card{width:min(460px,100%);padding:clamp(36px,7vw,68px) clamp(28px,6vw,56px);border:1px solid rgba(247,243,236,.42);background:rgba(11,13,12,.54);box-shadow:0 22px 80px rgba(0,0,0,.32);backdrop-filter:blur(14px);text-align:center}.mark{margin:0 0 42px;font-family:Georgia,serif;font-size:1.15rem;letter-spacing:.28em}.kicker{margin:0 0 14px;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase}.card h1{margin:0 0 24px;font-family:Georgia,serif;font-size:clamp(2.8rem,8vw,4.6rem);font-weight:400;line-height:.9;letter-spacing:-.06em}.card>p:not(.mark):not(.kicker){max-width:330px;margin:0 auto 32px;color:rgba(247,243,236,.8);font-size:.95rem}form{display:grid;gap:13px;text-align:left}label{display:grid;gap:8px;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase}input{width:100%;min-height:54px;padding:0 16px;border:1px solid rgba(247,243,236,.52);background:rgba(255,255,255,.08);color:#fff;outline:none}button{min-height:56px;margin-top:8px;border:1px solid #f7f3ec;background:#f7f3ec;color:#171716;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.error{margin:0;color:#ffc5bd;font-size:.82rem;letter-spacing:0;text-transform:none}iframe{display:block;width:100%;height:100%;border:0}

</head>
<body>
<main id="gate"><section class="card"><p class="mark">א · ד</p><p class="kicker">Частное приглашение</p><h1>Антон<br>и Диана</h1><p>Введите пароль из сообщения, чтобы открыть приглашение на хупу.</p><form id="form"><label>Пароль<input id="password" type="password" autocomplete="current-password" required autofocus></label><p class="error" id="error" hidden>Пароль не подошёл. Проверьте написание.</p><button>Открыть приглашение</button></form></section></main>

<script>
const password="Shalom221126",gate=document.querySelector("#gate"),frame=document.querySelector("#invitation");function openInvitation(){gate.hidden=true;frame.hidden=false;frame.src="https://anton-diana-chuppah.n-aorn2456.chatgpt.site/";[300,900,1800].forEach(t=>setTimeout(()=>frame.contentWindow?.postMessage("anton-diana:open","https://anton-diana-chuppah.n-aorn2456.chatgpt.site"),t));}if(sessionStorage.getItem("anton-diana-pages")==="open")openInvitation();document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();if(document.querySelector("#password").value===password){sessionStorage.setItem("anton-diana-pages","open");openInvitation()}else document.querySelector("#error").hidden=false});
